<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>핀 모음 지도</title>
<meta name="description" content="장소별로 모아 둔 핀 지도 — 남대문 장보기 외">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F6; --surface:#FFFFFF; --raised:#F7F8FA; --ink:#191F28; --ink-2:#4E5968; --ink-3:#8B95A1; --line:#E5E8EB;
  --accent:#191F28; --accent-ink:#FFFFFF; --tip:#FFF8E1; --tip-ink:#6B5300; --focus:#3182F6;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;--bg:#101215;--surface:#1B1D22;--raised:#24272D;--ink:#ECEEF1;--ink-2:#B0B8C1;--ink-3:#7E8794;--line:#2E3239;--accent:#ECEEF1;--accent-ink:#17191D;--tip:#2E2A1A;--tip-ink:#F1D98A}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

.app{height:100%;display:grid;grid-template-columns:420px minmax(0,1fr);overflow:hidden}
.panel,.mapwrap{min-width:0}
.panel{position:relative;z-index:2;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#E9ECEF}

/* 공통 머리 */
.top{display:flex;align-items:center;gap:6px;padding:14px 20px 0;min-height:44px}
.brand{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:0}
.back{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:2px;padding:6px 8px 6px 2px;margin-left:-4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
.back:hover{background:var(--raised)}
.hero{padding:10px 20px 18px}
.hero h1{margin:0;font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--ink-3);font-size:14px}

/* 홈: 컬렉션 목록 */
.cols{display:flex;flex-direction:column;gap:10px;padding:0 16px 24px}
.col{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 16px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.col:hover{border-color:var(--ink-3);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.col b{font-size:17px;font-weight:700}
.col .sub{grid-column:1;color:var(--ink-3);font-size:13.5px}
.col .arrow{grid-row:1/3;grid-column:2;align-self:center;color:var(--ink-3)}
.col .cats{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.empty-note{padding:0 20px;color:var(--ink-3);font-size:13px}

/* 컬렉션: 오시는 길 */
.access{margin:0 16px 14px;background:var(--raised);border-radius:var(--r);padding:4px 14px}
.access summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px;font-weight:700}
.access summary::-webkit-details-marker{display:none}
.access summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
.access[open] summary::after{transform:rotate(-135deg)}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lines{display:flex;gap:3px}
.ln{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;color:#fff;font-size:12px;font-weight:700}
.arow b{display:block;font-size:14.5px;font-weight:600}
.arow span.d{display:block;font-size:13px;color:var(--ink-3)}
.arow span.d a{color:var(--ink-2);text-underline-offset:2px}
.ghost{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}

/* 카테고리 탭 */
.tabs{position:sticky;top:0;z-index:3;background:var(--surface);display:flex;gap:6px;padding:8px 16px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:var(--raised);color:var(--ink-2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tab small{font-size:12.5px;font-weight:600;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.count{display:flex;justify-content:space-between;padding:12px 20px 4px;font-size:13px;color:var(--ink-3)}

/* 가게 목록 */
.rows{list-style:none;margin:0;padding:0 8px 24px}
.row{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:14px 12px;border-radius:12px;cursor:pointer}
.row:hover{background:var(--raised)}
.row.on{background:var(--raised)}
.row.done .rname{color:var(--ink-3);text-decoration:line-through}
.tag{font-size:12.5px;font-weight:600;color:var(--c)}
.tag i{font-style:normal;color:var(--ink-3);font-weight:500}
.rname{margin:1px 0 0;font-size:16px;font-weight:700;line-height:1.4}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:#FFF0C2;color:#7A5A00;margin-left:6px;vertical-align:2px}
.badge.soft{background:var(--raised);color:var(--ink-3)}
.rdesc{margin:3px 0 0;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unit{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.chk{appearance:none;align-self:start;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:transparent;cursor:pointer;display:grid;place-items:center;margin-top:2px}
.chk svg{width:14px;height:14px}
.row.done .chk{background:#22A06B;border-color:#22A06B;color:#fff}
.foot{padding:4px 20px 28px;font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* 지도 위 설명 카드 */
.card{position:absolute;z-index:20;left:12px;right:12px;bottom:12px;max-height:64%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:0 10px 32px rgba(0,0,0,.22)}
.chead{position:sticky;top:0;z-index:1;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.chead b{font-size:16px}
.chead span{color:var(--ink-3);font-size:13.5px;margin-left:6px}
.x{appearance:none;border:0;background:var(--raised);width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px}
.shop{padding:16px;border-bottom:8px solid var(--raised)}
.shop:last-child{border-bottom:0}
.shop h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.35}
.shop .where{margin-top:4px;font-size:13.5px;color:var(--ink-2)}
.shop .where b{font-weight:700;color:var(--ink)}
.shop .hl{margin:10px 0 0;font-size:14.5px;line-height:1.65}
.tip{margin:10px 0 0;background:var(--tip);color:var(--tip-ink);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.55}
.facts{display:grid;grid-template-columns:44px 1fr;gap:5px 8px;margin:12px 0 0;font-size:14px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts a{text-underline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:16px;height:16px}
.revs{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.revs summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2)}
.revs ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.revs li{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:13.5px;line-height:1.45}
.revs .k{font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--raised);border-radius:5px;padding:1px 6px;height:fit-content;white-space:nowrap}
.revs a{text-decoration:none}
.revs a:hover{text-decoration:underline}
.revs time{display:block;font-size:12px;color:var(--ink-3)}
.mark{appearance:none;border:1px solid var(--line);background:var(--surface);height:38px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.mark{white-space:nowrap;flex:none}
.mark svg{width:16px;height:16px;flex:none}
.btn{white-space:nowrap;flex:none}
.mark[aria-pressed="true"]{background:#E8F7F0;border-color:#22A06B;color:#137A4F}

/* 핀 */
.pin{position:relative;transform:translate(-50%,-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.pin .b{width:32px;height:32px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.28);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;font-family:var(--font);transition:transform .15s}
.pin .b svg{width:16px;height:16px}
.pin .l{position:absolute;top:36px;white-space:nowrap;background:#fff;color:#191F28;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);font-family:var(--font);display:none}
.zoomed .pin .l,.pin.on .l{display:block}
.pin.on .b{transform:scale(1.18);box-shadow:0 0 0 4px rgba(49,130,246,.35),0 3px 10px rgba(0,0,0,.3)}
.pin.dim{opacity:.25}

.nojs{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:24px;text-align:center;font-size:14px;color:#4E5968;background:#F2F4F6}
.nojs b{color:#191F28}
.static{padding:0 20px 24px}
.static h2{font-size:18px;margin:20px 0 8px}
.static li{margin:0 0 10px;font-size:14px}

@media (min-width:761px){.card{left:auto;width:400px;top:12px;bottom:auto;max-height:calc(100% - 24px)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:52% 48%}
  .mapwrap{order:1}
  .panel{order:2;border-right:0;border-radius:18px 18px 0 0;margin-top:-16px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .top{padding-top:12px}
  .hero{padding-bottom:14px}
  .hero h1{font-size:22px}
  .card{max-height:calc(100% - 28px);bottom:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <section class="panel" aria-label="목록">
    <div class="scroll" id="panel">
      <div class="top"><span class="brand">핀 모음 지도</span></div>
      <div class="hero"><h1>모아 둔 지도</h1><p>지도를 누르면 핀이 켜져요</p></div>
      <noscript><div class="static"><h2>핑핑하우스 (78곳)</h2><ul><li><b>나폴레옹과자점 성북본점</b> — 빵 · 성북동·한성대입구<br>1968년 문 연 «서울 3대 빵집»으로 꼽히는 노포 본점. 사라다빵·단팥빵·구로칸토슈니탱과 롤케이크·생크림 케이크가 대표.<br><a href="https://m.place.naver.com/place/11627707/home">네이버 지도</a></li><li><b>샤뽀블랑</b> — 빵 · 성북동<br>성북동 주민 단골이 많은 소담한 동네 빵집. 산딸기프레첼·앙버터·통팥빵·소프트마늘빵이 시그니처.<br><a href="https://m.place.naver.com/place/38009246/home">네이버 지도</a></li><li><b>밀곳간 본점</b> — 빵 · 성북동<br>천연효모로 만드는 식사빵 전문. 시오빵(소금빵)·사워도우·펌퍼니클·치아바타와 수제 샤퀴테리 샌드위치가 인기.<br><a href="https://m.place.naver.com/place/745830361/home">네이버 지도</a></li><li><b>성북동빵공장</b> — 빵 · 성북동<br>성북동 언덕 위 3층짜리 대형 베이커리 카페 본점. 초코바게트·연탄빵이 유명하고 테라스 전망이 좋음.<br><a href="https://m.place.naver.com/place/63234658/home">네이버 지도</a></li><li><b>베이커리 어썸피넛</b> — 빵 · 성신여대·돈암<br>직접 만든 100% 수제 피넛버터로 유명한 빵집. 땅콩크림빵이 대표이고 «생활의 달인»에도 나옴.<br><a href="https://m.place.naver.com/place/1543114408/home">네이버 지도</a></li><li><b>초로록베이커리</b> — 빵 · 성신여대·돈암<br>소금빵 종류가 많은 넓은 베이커리 카페. 토마토바질·올리브치즈·두바이초코 소금빵이 인기.<br><a href="https://m.place.naver.com/place/2090566869/home">네이버 지도</a></li><li><b>나따드나따</b> — 빵 · 성북동·한성대입구<br>포르투갈 제빵사가 만드는 정통 포르투갈식 에그타르트(나타)와 텐투갈. 오리지널·바닐라·라이트 맛을 고를 수 있음<br><a href="https://m.place.naver.com/place/1801628128/home">네이버 지도</a></li><li><b>흐노니 (카페·혼술바)</b> — 빵 · 성신여대·돈암<br>속 재료를 아낌없이 넣은 샌드베이글 — 과일부터 구황작물까지 조합이 색다름. 낮엔 카페, 밤엔 혼술바<br><a href="https://m.place.naver.com/place/2038328366/home">네이버 지도</a></li><li><b>리델리 (LEE DELI)</b> — 빵 · 성북동·한성대입구<br>밀곳간이 만든 샌드위치 가게. 고기를 직접 가공한 수제 햄과 신선한 재료를 아낌없이 넣고, 비건 샌드위치도 있음<br><a href="https://m.place.naver.com/place/2142562795/home">네이버 지도</a></li><li><b>아일 베이커리 (isle)</b> — 빵 · 한성대입구·성북천<br>성북천 바로 앞 컵케이크·로프 디저트 카페. 몽블랑·호지 카카오닙스 같은 시즌 컵케이크, 창밖으로 성북천이 보임<br><a href="https://m.place.naver.com/place/1212622367/home">네이버 지도</a></li><li><b>프로젝트 파이</b> — 빵 · 성북동<br>아보카도 오픈샌드위치·타르틴·그릭요거트볼 브런치 카페. 건강하면서도 든든한 한 끼<br><a href="https://m.place.naver.com/place/1871301415/home">네이버 지도</a></li><li><b>베이크하우스 서울</b> — 빵 · 한성대입구·삼선동<br>가벼운 쿠키부터 식사빵·케이크까지 종류가 많은   shops.sort((a,b)=>order.indexOf(a.c)-order.indexOf(b.c)||(a.sub-b.sub)||(b.tag?1:0)-(a.tag?1:0)||a.name.localeCompare(b.name,"ko"));
  const nDone = shops.filter(s=>done.has(doneKey(s))).length;
  p.innerHTML = `<div class="top"><button class="back" id="home">${ICON.back}핀 모음 지도</button></div>
    <div class="hero"><h1>${esc(c.name)}</h1><p>${esc(c.place)} · ${c.shops.length}곳 · ${esc(c.updated)} 기준</p></div>
    ${c.access?.length?`<details class="access" id="access" ${innerWidth>760?"open":""}><summary>${esc(c.accessTitle||"오시는 길")}</summary>${c.access.map((a,i)=>`
      <div class="arow"><span class="lines">${a.lines.map(([n,col])=>`<span class="ln" style="background:${col}">${esc(n)}</span>`).join("")}</span>
      <span><b>${esc(a.title)}</b><span class="d">${a.links?a.links.map(([t,q])=>`<a href="https://map.kakao.com/?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${esc(t)}</a>`).join(" · ")+" 노선 보기":esc(a.desc)}</span></span>
      <button class="ghost" data-a="${i}">지도</button></div>`).join("")}</details>`:""}
    <div class="tabs" role="group" aria-label="카테고리">
      <button class="tab" id="tab-all" data-k="all" aria-pressed="${S.cat==="all"}">전체<small>${c.shops.length}</small></button>
      ${c.categories.map(k=>`<button class="tab" id="tab-${k.key}" data-k="${k.key}" aria-pressed="${S.cat===k.key}">${esc(k.label)}<small>${c.shops.filter(s=>s.c===k.key).length}</small></button>`).join("")}
    </div>
    <div class="count"><span>${shops.length}곳${nDone?` · 다녀옴 ${nDone}`:""}</span><span>눌러서 자세히 보기</span></div>
    <ul class="rows">${shops.map(s=>{const k=c.cat[s.c];const on=S.sel===s.g;const d=done.has(doneKey(s));return `
      <li class="row ${on?"on":""} ${d?"done":""}" data-g="${s.g}" data-id="${s.id}" style="--c:${k.color}">
        <div>
          <div class="tag">${esc(k.label)}${s.spot?` <i>· ${esc(s.spot)}</i>`:""}</div>
          <h3 class="rname">${esc(s.name)}${s.tag?`<span class="badge">${esc(s.tag)}</span>`:(s.sub?`<span class="badge soft">가운 위주</span>`:"")}</h3>
          <p class="rdesc">${esc(s.hl)}</p>
          ${s.unit?`<span class="unit">${esc(s.unit.split(" (")[0])}</span>`:""}
        </div>
        <button class="chk" data-done="${s.id}" aria-pressed="${d}" aria-label="${esc(short(s))} 다녀옴 표시">${ICON.check}</button>
      </li>`}).join("")}</ul>
    <p class="foot">가게 정보는 ${esc(c.updated)} 네이버·유튜브 검색 기준이에요. 영업시간·휴무는 바뀔 수 있으니 가기 전에 확인하세요. ✓ 다녀옴 표시는 이 기기에만 저장돼요.</p>`;
  document.getElementById("home").onclick = ()=>{location.hash=""};
  p.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.cat=b.dataset.k; S.sel=null; S.focus=null; render(); fit()});
  p.querySelectorAll(".ghost[data-a]").forEach(b=>b.onclick=()=>{
    const [[s,w],[n,e]] = c.access[+b.dataset.a].bounds;
    if(map) map.setBounds(new kakao.maps.LatLngBounds(new kakao.maps.LatLng(s,w),new kakao.maps.LatLng(n,e)));
  });
  p.querySelectorAll(".row").forEach(r=>r.onclick=e=>{
    if(e.target.closest(".chk")) return;
    select(r.dataset.g, r.dataset.id, true);
  });
  p.querySelectorAll(".chk").forEach(b=>b.onclick=()=>toggleDone(b.dataset.done));
}

function toggleDone(id){
  const k = S.col+":"+id;
  done.has(k)?done.delete(k):done.add(k);
  store.set("pm-done",[...done]);
  const keep = document.getElementById("panel").scrollTop, ckeep = document.getElementById("card").scrollTop;
  render();
  document.getElementById("panel").scrollTop = keep; document.getElementById("card").scrollTop = ckeep;
}

// ── 지도 위 설명 카드
function renderCard(){
  const card = document.getElementById("card");
  const c = col();
  if(!c||!S.sel){card.hidden=true; card.innerHTML=""; return}
  const g = c.groups.find(g=>g.id===S.sel);
  const shops = g.shops.filter(visible);
  card.hidden = false;
  card.innerHTML = `<div class="chead"><div><b>${esc(groupLabel(g))}</b>${shops.length>1?`<span>${shops.length}곳</span>`:""}</div><button class="x" id="card-x" aria-label="닫기">${ICON.x}</button></div>`+
    shops.map(s=>{const k=c.cat[s.c];const d=done.has(doneKey(s));
      const facts=[["주소",s.addr],["전화",s.tel?s.tel:""],["영업",s.hours]].filter(f=>f[1]).map(([t,v])=>`<dt>${t}</dt><dd>${t==="전화"?esc(v).replace(/(0\d{1,3}-\d{3,4}-\d{4})/g,'<a href="tel:$1">$1</a>'):esc(v)}</dd>`).join("");
      return `<article class="shop" id="shop-${s.id}" style="--c:${k.color}">
        <div class="tag">${esc(k.full||k.label)}</div>
        <h3>${esc(s.name)}${s.tag?`<span class="badge">${esc(s.tag)}</span>`:(s.sub?`<span class="badge soft">가운 위주</span>`:"")}</h3>
        <div class="where">${s.unit?`<b>${esc(s.unit.split(" (")[0])}</b> · `:""}${esc(s.bld)}</div>
        <p class="hl">${esc(s.hl)}</p>
        ${s.note?`<p class="tip">${esc(s.note)}</p>`:""}
        <dl class="facts">${facts}</dl>
        <div class="acts">
          <a class="btn primary" href="${routeUrl(s)}" target="_blank" rel="noopener">${ICON.route}길찾기</a>
          ${s.place?`<a class="btn" href="${esc(s.place)}" target="_blank" rel="noopener">네이버 지도</a>`:""}
          ${s.kakao?`<a class="btn" href="${esc(s.kakao)}" target="_blank" rel="noopener">카카오맵</a>`:""}
          <button class="mark" data-done="${s.id}" aria-pressed="${d}">${ICON.check}${d?"다녀옴":"다녀왔어요"}</button>
        </div>
        ${s.revs.length?`<details class="revs"><summary>후기 ${s.revs.length}개</summary><ol>${s.revs.map(r=>`<li><span class="k">${esc(SRC[r.k]||r.k)}</span><span><a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t||r.u.replace(/^https?:\/\//,""))}</a>${r.d?`<time>${esc(r.d)}</time>`:""}</span></li>`).join("")}</ol></details>`:""}
      </article>`}).join("");
  document.getElementById("card-x").onclick = ()=>{S.sel=null; S.focus=null; render()};
  card.querySelectorAll(".mark").forEach(b=>b.onclick=()=>toggleDone(b.dataset.done));
}

// ── 핀
function renderPins(){
  if(!map) return;
  overlays.forEach(o=>o.setMap(null)); overlays=[];
  const c = col(); if(!c) return;
  c.groups.forEach(g=>{
    const shops = g.shops.filter(visible);
    if(!shops.length) return;                       // 고른 카테고리에 없는 건물은 핀을 끈다
    const cats = [...new Set(shops.map(s=>s.c))];
    const color = cats.length===1?c.cat[cats[0]].color:"#191F28";
    const el = document.createElement("div");
    el.className = "pin"+(S.sel===g.id?" on":"");
    el.style.setProperty("--c",color);
    el.innerHTML = `<div class="b">${shops.length>1?shops.length:ICON[c.cat[cats[0]].icon]||ICON.pin}</div><div class="l">${esc(groupLabel(g))}</div>`;
    el.title = shops.map(s=>s.name).join(", ");
    el.onclick = ()=>select(g.id,null,false);
    const o = new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(g.lat,g.lng),content:el,xAnchor:0,yAnchor:0,zIndex:S.sel===g.id?100:shops.length,clickable:true});
    o.setMap(map); overlays.push(o);
  });
}

function select(gid, shopId, fromList){
  S.sel = gid; S.focus = shopId; render();
  const c = col(), g = c.groups.find(g=>g.id===gid);
  if(map){ if(fromList&&map.getLevel()>2) map.setLevel(2); map.panTo(new kakao.maps.LatLng(g.lat,g.lng)); }
  if(shopId){ const el=document.getElementById("shop-"+shopId); const card=document.getElementById("card"); if(el) card.scrollTop = el.offsetTop - 58; }
}

function fit(){
  if(!map) return;
  const c = col();
  if(!c){ map.setLevel(13); map.setCenter(new kakao.maps.LatLng(36.4,127.9)); return; }
  const b = new kakao.maps.LatLngBounds();
  c.groups.filter(g=>g.shops.some(visible)).forEach(g=>b.extend(new kakao.maps.LatLng(g.lat,g.lng)));
  map.setBounds(b, 50, 50, 50, 50);
}

function render(){ renderPanel(); renderCard(); renderPins(); }

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  S.col = COLLECTIONS.some(c=>c.id===id)?id:null;
  S.cat = "all"; S.sel = null; S.focus = null;
  render(); fit(); if(map) kakao.maps.event.trigger(map,"zoom_changed");
  document.getElementById("panel").scrollTop = 0;
  document.title = col()?`${col().name} · 핀 모음 지도`:"핀 모음 지도";
}
addEventListener("hashchange", route);

route();
if(window.kakao && kakao.maps){
  kakao.maps.load(()=>{
    document.getElementById("nojs")?.remove();
    map = new kakao.maps.Map(document.getElementById("map"),{center:new kakao.maps.LatLng(36.4,127.9),level:13});
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    const wrap = document.querySelector(".mapwrap");
    const zoomCls = ()=>wrap.classList.toggle("zoomed", map.getLevel()<=(col()?.labelLevel||2));
    kakao.maps.event.addListener(map,"zoom_changed",zoomCls);
    kakao.maps.event.addListener(map,"click",()=>{ if(S.sel){S.sel=null; S.focus=null; render()} });
    renderPins(); fit(); zoomCls();
    new ResizeObserver(()=>map.relayout()).observe(wrap);
  });
}
</script>
</body>
</html>
